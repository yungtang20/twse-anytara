name: TDCC historical sync guidance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guidance:
    runs-on: ubuntu-latest
    steps:
      - name: Explain TDCC synchronization boundaries
        run: |
          echo "The daily workflow owns current official TDCC open-data synchronization."
          echo "Historical 52-week backfill is not automated by this workflow and requires explicit approval."
          echo "Local SQLite must not be used as a production cloud-backfill source."
